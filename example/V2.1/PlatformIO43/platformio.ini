; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Keep generated PlatformIO data inside the project directory.
boards_dir = .
core_dir = .pio/core
packages_dir = .pio/packages

[env:esp32-s3-devkitc-1-myboard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1-myboard
framework = arduino
; The board uses QIO flash and external PSRAM.
board_build.arduino.memory_type = qio_qspi
build_flags = -DBOARD_HAS_PSRAM
	-DLV_CONF_SKIP

; Lock the graphics and touch library versions used by this lesson.
lib_deps = 
	lvgl/lvgl@9.1.0
	paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8
	moononournation/GFX Library for Arduino@1.6.5
